        <rect x="540" y="236" width="58" height="28" rx="7" fill="#4a9eff"/>
        <text x="569" y="255" text-anchor="middle" fill="#08131f" font-size="12" font-weight="700">All</text>

        <rect x="606" y="236" width="92" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
        <text x="652" y="255" text-anchor="middle" fill="#e8eaed" font-size="12">Structures</text>

        <rect x="706" y="236" width="90" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
