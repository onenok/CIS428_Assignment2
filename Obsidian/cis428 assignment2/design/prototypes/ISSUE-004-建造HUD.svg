    <g font-size="11">
      <rect x="90" y="1156" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="121" y="1184" text-anchor="middle" fill="#e8eaed" font-size="12">Hut</text><text x="121" y="1202" text-anchor="middle" fill="#6f7885" font-size="10">13 blk</text>
      <rect x="158" y="1156" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="189" y="1184" text-anchor="middle" fill="#e8eaed" font-size="12">Tower</text><text x="189" y="1202" text-anchor="middle" fill="#6f7885" font-size="10">25 blk</text>
      <rect x="226" y="1156" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="257" y="1184" text-anchor="middle" fill="#e8eaed" font-size="12">Table</text><text x="257" y="1202" text-anchor="middle" fill="#6f7885" font-size="10">17 blk</text>
      <rect x="294" y="1156" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="325" y="1184" text-anchor="middle" fill="#e8eaed" font-size="12">Chair</text><text x="325" y="1202" text-anchor="middle" fill="#6f7885" font-size="10">6 blk</text>
      <rect x="362" y="1156" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="393" y="1184" text-anchor="middle" fill="#e8eaed" font-size="12">Tree</text><text x="393" y="1202" text-anchor="middle" fill="#6f7885" font-size="10">19 blk</text>
      <rect x="430" y="1156" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="461" y="1184" text-anchor="middle" fill="#e8eaed" font-size="12">Rock</text><text x="461" y="1202" text-anchor="middle" fill="#6f7885" font-size="10">28 blk</text>
