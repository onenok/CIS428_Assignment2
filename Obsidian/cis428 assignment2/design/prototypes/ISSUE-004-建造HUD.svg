        <text x="775" y="308" text-anchor="middle" fill="#e8eaed" font-size="12">Chair</text>
        <text x="775" y="326" text-anchor="middle" fill="#6f7885" font-size="10">6 blk</text>

        <rect x="812" y="280" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
        <text x="843" y="308" text-anchor="middle" fill="#e8eaed" font-size="12">Tree</text>
        <text x="843" y="326" text-anchor="middle" fill="#6f7885" font-size="10">19 blk</text>
      </g>
      <!-- clipped 6th -->
