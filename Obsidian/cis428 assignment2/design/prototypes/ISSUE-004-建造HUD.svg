    <text x="72" y="906">① preset 面板置於 top-center；tabs 一列 4 顆（All + 3 分類），選中的是 primary 樣式</text>
    <text x="72" y="928">② 下方設計按鈕列依分類變化（圖中為 All＝6 個設計，寬度不足時橫向裁切，之後可加左右箭頭）</text>
    <text x="72" y="950">③ hotbar 每個槽位：3× 等角方塊圖示（32×32）＋ 名稱 9px 單行省略號，兩者都水平置中</text>
  </g>

