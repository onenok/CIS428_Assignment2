    <circle cx="762" cy="560" r="26" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.65"/>
    <text x="762" y="606" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.7">十字準心維持不變</text>

    <!-- preset panel (top-center) -->
