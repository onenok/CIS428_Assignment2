      <rect x="1150" y="686" width="200" height="40" rx="9" fill="rgba(12,14,20,0.82)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="1160" y="695" width="64" height="22" rx="6" fill="#2d3250" stroke="rgba(255,255,255,0.15)"/>
