    <use href="#cube-grass" x="560" y="486" transform="translate(560,486) scale(3) translate(-560,-486)"/>
    <g transform="translate(700,472) scale(3)">
      <use href="#cube-planks" x="0" y="0"/>
    </g>
    <g transform="translate(700,424) scale(3)">
