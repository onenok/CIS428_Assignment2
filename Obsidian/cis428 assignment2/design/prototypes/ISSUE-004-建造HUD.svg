<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1680" preserveAspectRatio="xMidYMin meet" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2436"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7a35"/>
      <stop offset="1" stop-color="#2f4d21"/>
    </linearGradient>

    <!-- isometric block icons, 32x32, colours derived from PLACEHOLDER_SPECS -->
    <g id="cube-grass"><polygon points="16,0 32,8 16,16 0,8" fill="#5f9f35"/><polygon points="0,8 16,16 16,32 0,24" fill="#866043"/><polygon points="32,8 16,16 16,32 32,24" fill="#684a34"/></g>
    <g id="cube-dirt"><polygon points="16,0 32,8 16,16 0,8" fill="#9a6e4d"/><polygon points="0,8 16,16 16,32 0,24" fill="#866043"/><polygon points="32,8 16,16 16,32 32,24" fill="#684a34"/></g>
    <g id="cube-stone"><polygon points="16,0 32,8 16,16 0,8" fill="#909090"/><polygon points="0,8 16,16 16,32 0,24" fill="#7d7d7d"/><polygon points="32,8 16,16 16,32 32,24" fill="#5e5e5e"/></g>
    <g id="cube-cobble"><polygon points="16,0 32,8 16,16 0,8" fill="#7f7f7f"/><polygon points="0,8 16,16 16,32 0,24" fill="#6e6e6e"/><polygon points="32,8 16,16 16,32 32,24" fill="#545454"/></g>
    <g id="cube-planks"><polygon points="16,0 32,8 16,16 0,8" fill="#ba9a5a"/><polygon points="0,8 16,16 16,32 0,24" fill="#a2824e"/><polygon points="32,8 16,16 16,32 32,24" fill="#7d653c"/></g>
    <g id="cube-log"><polygon points="16,0 32,8 16,16 0,8" fill="#9a7d4d"/><polygon points="0,8 16,16 16,32 0,24" fill="#665132"/><polygon points="32,8 16,16 16,32 32,24" fill="#4f3f27"/></g>
    <g id="cube-sand"><polygon points="16,0 32,8 16,16 0,8" fill="#fceebb"/><polygon points="0,8 16,16 16,32 0,24" fill="#dbcfa3"/><polygon points="32,8 16,16 16,32 32,24" fill="#b0a684"/></g>
    <g id="cube-glass"><polygon points="16,0 32,8 16,16 0,8" fill="#e6ffff" opacity="0.62"/><polygon points="0,8 16,16 16,32 0,24" fill="#c8e6f0" opacity="0.5"/><polygon points="32,8 16,16 16,32 32,24" fill="#9dc0cc" opacity="0.5"/></g>
    <g id="cube-bricks"><polygon points="16,0 32,8 16,16 0,8" fill="#964a3c"/><polygon points="0,8 16,16 16,32 0,24" fill="#964a3c"/><polygon points="32,8 16,16 16,32 32,24" fill="#733a30"/></g>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1440" height="1680" fill="#080a0e"/>
  <text x="72" y="64" fill="#e8eaed" font-size="30" font-weight="600">ISSUE-004 建造 HUD — 修正草圖（方案 B）</text>
  <text x="72" y="98" fill="#6f7885" font-size="15">preset tabs 接上分類 → 更新下方設計按鈕（蓋下去留待之後）；hotbar 改為「圖示 + 名稱」，名稱置中不溢出</text>

