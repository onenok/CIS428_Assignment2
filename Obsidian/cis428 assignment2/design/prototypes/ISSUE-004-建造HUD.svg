        <text x="718" y="804" text-anchor="middle" fill="#c7ccd4" font-size="9">Stone</text>

        <rect x="754" y="752" width="60" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
