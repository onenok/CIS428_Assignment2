        <text x="571" y="308" text-anchor="middle" fill="#e8eaed" font-size="12">Hut</text>
        <text x="571" y="326" text-anchor="middle" fill="#8fb8e0" font-size="10">13 blk</text>

        <rect x="608" y="280" width="62" height="58" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
